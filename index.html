<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; img-src 'self' blob:; style-src 'self'; script-src 'self' 'sha384-GJqSu7vueQ9qN0E9yLPb3Wtpd7OrgK8KmYzC8T1IysG1bcvxvIO4qtYR/D3A991F' https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/ https://cdn.jsdelivr.net/npm/tesseract.js-core@v5.0.0/ 'wasm-unsafe-eval'; worker-src blob:; connect-src https://cdn.jsdelivr.net/npm/tesseract.js-core@v5.0.0/ https://tessdata.projectnaptha.com/4.0.0/">
    <title>画像から文字を抽出</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container">
        <h1>画像から文字を抽出</h1>
        <p>画像ファイルを選ぶか、スクリーンショットを貼り付けエリアに貼り付けてください。</p>

        <label for="imageInput">画像ファイルを選択</label>
        <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp">

        <div id="pasteArea" class="paste-area" tabindex="0" role="region"
             aria-label="画像の貼り付けエリア">
            <p><strong>ここをクリックしてから Ctrl+V</strong></p>
            <p>コピーしたスクリーンショットを貼り付けられます</p>
        </div>

        <h2>画像データ削除ボタン</h2>
        <button id="deleteImageButton" type="button">画像データを削除</button>
        <p>画像データを消すことが出来ます</p>

        <div id="imageContainer" class="image-container" hidden>
        <h2>読み取り対象の画像</h2>
        <img id="imagePreview" alt="読み取り対象の画像">
        </div>

        <button id="extractTextButton" type="button">文字を抽出</button>
        <p id="status" role="status" aria-live="polite">画像を選択または貼り付けてください。</p>

        <section id="resultContainer">
            <h2>抽出された文字</h2>
            <textarea id="extractedText" rows="10" readonly
                placeholder="読み取った文字がここに表示されます。"></textarea>
            <button id="copyTextButton" type="button" disabled>テキストをコピー</button>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"
        integrity="sha384-GJqSu7vueQ9qN0E9yLPb3Wtpd7OrgK8KmYzC8T1IysG1bcvxvIO4qtYR/D3A991F"
        crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
